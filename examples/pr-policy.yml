# Copy to .github/workflows/pr-policy.yml in a repo.
name: pr-policy
on:
  pull_request:
    # edited/labeled/unlabeled: the check re-reads the body and labels, so
    # fixing the band line or adding size-override turns it green.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    # Pin to a ci-policy commit (full SHA) and pass the same SHA as ci-policy-ref.
    uses: drench44/ci-shared/.github/workflows/pr-policy.yml@<full sha> # main @ <short sha>
    with:
      ci-policy-ref: <full sha>
      # Private repo: your self-hosted runner labels. Public repo: '"ubuntu-latest"'.
      runs-on: '["self-hosted"]'
