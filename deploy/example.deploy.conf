# Example homelab-deploy config. Copy into a repo (for example deploy/deploy.conf),
# edit, and run: path/to/ci-policy/deploy/homelab-deploy deploy/deploy.conf
# Every setting is documented at the top of deploy/deploy-lib.sh.

DL_SERVICE=example-app
DL_REMOTE=homelab-box                      # ssh host; empty = docker on this machine
DL_COMPOSE_DIR='~/docker-services/example-app'
DL_SERVICES="web"                          # empty = every service in the project

# The health gate. /health must PROVE the app works, not just answer.
DL_HEALTH_URL="http://homelab-box:8080/health"
# Fields that must be present and truthy (an integration that needs a token
# from .env is the classic one: a deleted .env makes it false).
DL_HEALTH_REQUIRE=".integrations.home_assistant.configured .integrations.home_assistant.ok"
# Data that must be recent: "<jq path> <max age in seconds>", one per line.
DL_HEALTH_FRESH=".data.updated_at 900"
DL_HEALTH_TIMEOUT=120
# Answers 2xx whenever the process is up: the least a rollback must prove
# when the version it goes back to did not pass the full gate before.
DL_LIVENESS_URL="http://homelab-box:8080/healthz"

# Deploy tags (rollback-point/, deploy/, failed-deploy/) are pushed only to a
# private remote. For a public repo keep them in the deploying clone:
# DL_TAG_PUSH=local

# Checked on the box after dl_sync and before anything restarts.
DL_REQUIRE_FILES=".env config.json"
DL_REQUIRE_ENV=".env:HA_TOKEN"

# Files snapshot before dl_sync, restored on rollback. Keep big data out.
DL_SNAPSHOT_EXCLUDE="./data"

# Copy the repo to the box. Never --delete files the box owns (.env, config.json, data/).
dl_sync() {
  rsync -a --exclude .git --exclude .env --exclude config.json --exclude data/ \
    "$DL_GIT_DIR/" "$DL_REMOTE:docker-services/example-app/"
}

