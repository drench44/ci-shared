# Reusable main-branch watchdog. Call it on push to the default branch AND on a
# schedule; see examples/main-watch.yml. Every new commit must come from a
# merged PR whose head checks were all green (or match
# policy/main-allowlist.json, the only allow list; no rule passes a commit
# that touches .github/). Anything else, and any force push or branch
# deletion, opens (or comments on) one issue labeled main-watch, which GitHub
# emails to the repo owner. Checks still running when the PR was merged are
# waited for: the commit gets a pending ci-policy/main-watch status and the
# scheduled run re-reads them until pending-timeout-minutes. Every judged
# commit gets that status; main-watch-audit.yml reads it from outside the
# homelab. Alerts only; it never reverts anything.
name: main-watch

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON for runs-on. Private repos: '["self-hosted"]'. Public
          repos: '"ubuntu-latest"'.
        type: string
        default: '"ubuntu-latest"'
      ci-policy-ref:
        description: Ref of drench44/ci-shared to run. Keep it the same as the ref in `uses:`.
        type: string
        default: main
      branch:
        description: Branch to watch. Empty means the repo's default branch.
        type: string
        default: ""
      ignore-checks:
        description: >-
          Check names (globs) to leave out when judging a PR head. A glob that
          ignores every check (for example '*') is refused unless
          required-checks names the checks that must pass.
        type: string
        default: ""
      required-checks:
        description: >-
          Check run names or commit status contexts that must be present and
          green on the PR head, one per line, exact names (for example
          "Vitest (full suite)"). A missing one counts as not green.
        type: string
        default: ""
      require-checks:
        description: >-
          Whether a PR head needs at least one passing check. auto (default):
          yes when the repo has any active workflow besides this one.
        type: string
        default: auto
      pending-timeout-minutes:
        description: >-
          How long after the merge to keep waiting for checks that were still
          running when the PR was merged, before flagging the commit.
        type: string
        default: "180"
      fail-on-alert:
        description: Also turn this run red when something is flagged.
        type: string
        default: "true"
      audit-workflow:
        description: >-
          Only in the repo that runs main-watch-audit: its workflow file name
          (for example main-watch-audit.yml). The scheduled re-check then
          alerts when that workflow has not succeeded for
          audit-max-age-hours, so a disabled schedule cannot go quiet.
        type: string
        default: ""
      audit-max-age-hours:
        description: How old the audit's last success may be (with audit-workflow).
        type: string
        default: "48"

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write
  issues: write

jobs:
  main-watch:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - name: Check out ci-policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drench44/ci-shared
          ref: ${{ inputs.ci-policy-ref }}
          path: .ci-policy
          persist-credentials: false
      - name: Check the push
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-policy/lib
          PYTHONDONTWRITEBYTECODE: "1"
          INPUT_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_ALLOWLIST_FILE: ${{ github.workspace }}/.ci-policy/policy/main-allowlist.json
          INPUT_IGNORE_CHECKS: ${{ inputs.ignore-checks }}
          INPUT_REQUIRED_CHECKS: ${{ inputs.required-checks }}
          INPUT_REQUIRE_CHECKS: ${{ inputs.require-checks }}
          INPUT_PENDING_TIMEOUT_MINUTES: ${{ inputs.pending-timeout-minutes }}
          INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
          INPUT_AUDIT_WORKFLOW: ${{ inputs.audit-workflow }}
          INPUT_AUDIT_MAX_AGE_HOURS: ${{ inputs.audit-max-age-hours }}
        run: python3 -m ci_policy.main_watch
